name: ${COMPOSE_PROJECT_NAME:-watcher}

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./deploy/runtime/postgres.env
    volumes:
      - watcher-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m

  migrate:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/watcher:${IMAGE_TAG:?IMAGE_TAG is required}
    command:
      [
        './packages/database/node_modules/.bin/prisma',
        'migrate',
        'deploy',
        '--config',
        'packages/database/prisma.config.ts',
      ]
    env_file:
      - ./deploy/runtime/migrate.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m

  stocks-bot:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/watcher:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ['node', 'apps/stocks-bot/dist/index.js']
    env_file:
      - ./deploy/runtime/stocks-bot.env
    environment:
      NODE_ENV: production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m

  publications-bot:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/watcher:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ['node', 'apps/publications-bot/dist/index.js']
    env_file:
      - ./deploy/runtime/publications-bot.env
    environment:
      NODE_ENV: production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m

  briefing-bot:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/watcher:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ['node', 'apps/briefing-bot/dist/index.js']
    env_file:
      - ./deploy/runtime/briefing-bot.env
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:8789:8789'
    volumes:
      - ./deploy/piper-voices:/data/piper:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m

volumes:
  watcher-postgres:
