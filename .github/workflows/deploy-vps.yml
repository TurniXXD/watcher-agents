name: deploy-vps

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - watcher-ci
    types:
      - completed
    branches:
      - main

concurrency:
  group: watcher-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare release
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy-ready: ${{ steps.release_files.outputs.deploy-ready }}
      image-namespace: ${{ steps.release.outputs.image-namespace }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        name: Resolve release metadata
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          sha="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          image_namespace="${GITHUB_REPOSITORY_OWNER,,}"

          {
            echo "image-namespace=$image_namespace"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.sha }}

      - id: release_files
        name: Validate release files
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f Dockerfile ]]; then
            echo "Watcher runtime files have not been scaffolded yet; deployment is skipped."
            exit 0
          fi

          test -f Dockerfile
          test -f docker-compose.production.yml
          test -x deploy/deploy.sh
          echo "deploy-ready=true" >> "$GITHUB_OUTPUT"

  publish-image:
    name: Publish production image
    needs: prepare
    if: needs.prepare.outputs.deploy-ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Build and publish Watcher image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=watcher-production
          cache-to: type=gha,mode=max,scope=watcher-production
          context: .
          file: Dockerfile
          provenance: true
          push: true
          sbom: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.image-namespace }}/watcher:${{ needs.prepare.outputs.sha }}
            ghcr.io/${{ needs.prepare.outputs.image-namespace }}/watcher:latest

  deploy:
    name: Deploy to VPS
    needs:
      - prepare
      - publish-image
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TS_TAG: ${{ vars.TS_TAG || 'tag:ci' }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Validate VPS configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_ENV_FILE"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          test -n "$TS_OAUTH_CLIENT_ID"
          test -n "$TS_OAUTH_SECRET"
          test -n "$TS_TAG"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_ENV_FILE" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$TS_TAG" =~ ^tag:[A-Za-z0-9._-]+$ ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ping: ${{ secrets.DEPLOY_HOST }}
          tags: ${{ vars.TS_TAG || 'tag:ci' }}

      - name: Upload production deployment files
        shell: bash
        run: |
          set -euo pipefail

          scp -P "$DEPLOY_PORT" \
            docker-compose.production.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.production.yml.next"
          scp -P "$DEPLOY_PORT" \
            deploy/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy.sh.next"

      - name: Update Watcher services on server
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
            cd '$DEPLOY_PATH'

            dump_logs() {
              echo
              echo '=== docker compose ps ==='
              IMAGE_REGISTRY=ghcr.io IMAGE_NAMESPACE=diagnostic IMAGE_TAG=diagnostic \
                docker compose --env-file '$DEPLOY_ENV_FILE' -f docker-compose.production.yml ps --all || true
              echo
              echo '=== migrate logs ==='
              IMAGE_REGISTRY=ghcr.io IMAGE_NAMESPACE=diagnostic IMAGE_TAG=diagnostic \
                docker compose --env-file '$DEPLOY_ENV_FILE' -f docker-compose.production.yml logs --tail 200 migrate || true
              echo
              echo '=== stocks bot logs ==='
              IMAGE_REGISTRY=ghcr.io IMAGE_NAMESPACE=diagnostic IMAGE_TAG=diagnostic \
                docker compose --env-file '$DEPLOY_ENV_FILE' -f docker-compose.production.yml logs --tail 200 stocks-bot || true
              echo
              echo '=== publications bot logs ==='
              IMAGE_REGISTRY=ghcr.io IMAGE_NAMESPACE=diagnostic IMAGE_TAG=diagnostic \
                docker compose --env-file '$DEPLOY_ENV_FILE' -f docker-compose.production.yml logs --tail 200 publications-bot || true
              echo
              echo '=== briefing bot logs ==='
              IMAGE_REGISTRY=ghcr.io IMAGE_NAMESPACE=diagnostic IMAGE_TAG=diagnostic \
                docker compose --env-file '$DEPLOY_ENV_FILE' -f docker-compose.production.yml logs --tail 200 briefing-bot || true
            }

            trap 'dump_logs' ERR

            install -d -m 700 deploy/runtime
            mv docker-compose.production.yml.next docker-compose.production.yml
            mv deploy.sh.next deploy/deploy.sh
            chmod 700 deploy/deploy.sh
            test -f '$DEPLOY_ENV_FILE'
            printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin
            IMAGE_REGISTRY=ghcr.io \
              IMAGE_NAMESPACE='${{ needs.prepare.outputs.image-namespace }}' \
              IMAGE_TAG='${{ needs.prepare.outputs.sha }}' \
              ENV_FILE='$DEPLOY_ENV_FILE' \
              ./deploy/deploy.sh"
