name: watcher-security-scan

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - deploy-vps
    types:
      - completed
    branches:
      - main

concurrency:
  group: watcher-security-scan
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: Scan dependencies and deployed image
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SECURITY_SCAN_MIN_INTERVAL_MINUTES: ${{ vars.SECURITY_SCAN_MIN_INTERVAL_MINUTES || '360' }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TS_TAG: ${{ vars.TS_TAG || 'tag:ci' }}
    steps:
      - name: Validate scanner transport configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PATH"
          test -n "$TS_OAUTH_CLIENT_ID"
          test -n "$TS_OAUTH_SECRET"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$TS_TAG" =~ ^tag:[A-Za-z0-9._-]+$ ]]
          [[ "$SECURITY_SCAN_MIN_INTERVAL_MINUTES" =~ ^[0-9]+$ ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ping: ${{ secrets.DEPLOY_HOST }}
          tags: ${{ vars.TS_TAG || 'tag:ci' }}

      - id: release
        name: Resolve the deployed release
        shell: bash
        run: |
          set -euo pipefail

          sha="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sed -n 's/^IMAGE_TAG=//p' '$DEPLOY_PATH/.release.env'")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image-namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout deployed release
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Validate release scanner scripts
        shell: bash
        run: |
          set -euo pipefail

          test -x deploy/security-scan.sh
          test -x deploy/ingest-security-report.sh

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - id: image
        name: Resolve immutable production image
        env:
          IMAGE_NAMESPACE: ${{ steps.release.outputs.image-namespace }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/$IMAGE_NAMESPACE/watcher:$RELEASE_SHA"
          manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest // empty' <<< "$manifest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "reference=ghcr.io/$IMAGE_NAMESPACE/watcher@$digest" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy and scan state
        uses: actions/cache/restore@v5
        with:
          path: |
            .trivy-cache
            .security-scan-state
          key: watcher-security-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            watcher-security-${{ runner.os }}-

      - id: trivy
        name: Run isolated Trivy targets
        continue-on-error: true
        env:
          SECURITY_SCAN_IMAGE: ${{ steps.image.outputs.reference }}
        shell: bash
        run: |
          SECURITY_SCAN_DOCKER_CONFIG="$HOME/.docker/config.json" \
            ./deploy/security-scan.sh

      - name: Upload and ingest successful reports
        shell: bash
        run: |
          set -euo pipefail

          remote_reports="$DEPLOY_PATH/deploy/security-reports"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '$remote_reports'"

          for target in dependencies image; do
            report="deploy/security-reports/$target.json"
            key_file="deploy/security-reports/$target.scan-key"
            if [[ ! -s "$report" || ! -s "$key_file" ]]; then
              continue
            fi
            scan_key="$(<"$key_file")"
            [[ "$scan_key" =~ ^[A-Za-z0-9:._@/+==-]+$ ]]
            scp -P "$DEPLOY_PORT" "$report" \
              "$DEPLOY_USER@$DEPLOY_HOST:$remote_reports/$target.json.next"
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "mv '$remote_reports/$target.json.next' '$remote_reports/$target.json' && chmod 600 '$remote_reports/$target.json'"
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "'$DEPLOY_PATH/deploy/ingest-security-report.sh' watcher '$target' '$scan_key' '$remote_reports/$target.json'"
            ./deploy/security-scan.sh --mark-ingested "$target" "$scan_key"
          done

      - name: Save Trivy and successful-target state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .trivy-cache
            .security-scan-state
          key: watcher-security-${{ runner.os }}-${{ github.run_id }}

      - name: Fail when any independent scan target failed
        if: steps.trivy.outcome != 'success'
        shell: bash
        run: |
          echo 'One or more Trivy targets failed; successful targets were still ingested.' >&2
          exit 1
