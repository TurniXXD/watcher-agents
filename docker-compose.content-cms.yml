# Vantuch Content Hub (Payload CMS) for the production server directory.
# It is a separate Compose project from Watcher, so Watcher releases never
# restart it. Images are published by the deploy workflow with the release SHA.
#
#   docker compose --env-file .release.env -f docker-compose.content-cms.yml up -d
#
# Runtime env files (mode 0600, never committed):
#   deploy/runtime/content-cms.env           (from deploy/presets/content-cms.env.example)
#   deploy/runtime/content-cms-postgres.env  (from deploy/presets/content-cms-postgres.env.example)
name: vantuch-content

services:
  content-cms-postgres:
    image: postgres:16-alpine
    mem_limit: 768m
    env_file:
      - ./deploy/runtime/content-cms-postgres.env
    volumes:
      - content-cms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m

  content-cms:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/vantuch-content-cms:${IMAGE_TAG:?IMAGE_TAG is required}
    mem_limit: 1g
    env_file:
      - ./deploy/runtime/content-cms.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TRUST_PROXY_HEADERS: 'true'
    ports:
      # Loopback-only fallback; public traffic arrives through cloudflared on `vantuch`.
      - '127.0.0.1:${CONTENT_CMS_HOST_PORT:-3100}:3000'
    networks:
      default:
      vantuch:
        aliases:
          - vantuch-content-cms
    depends_on:
      content-cms-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/apps/content-cms/.next/cache
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m

volumes:
  content-cms-postgres:

networks:
  vantuch:
    external: true
    name: vantuch
